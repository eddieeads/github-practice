<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eddie's First Webpage</title>
    <style>
      :root {
        --bg: #081a2a;
        --bg-accent: #102b42;
        --panel: #0e263d;
        --card: rgba(13, 35, 56, 0.9);
        --text: #eaf4ff;
        --muted: #bfd6ee;
        --link: #7ec8ff;
        --link-hover: #a7dbff;
        --border: rgba(126, 200, 255, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      html {
        font-size: 16px;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg) 0%, var(--bg-accent) 100%);
        color: var(--text);
      }

      .card {
        width: min(92vw, 760px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: clamp(1.5rem, 4vw, 3rem);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
        color: var(--muted);
      }

      a {
        display: inline-block;
        margin-top: 1.5rem;
        color: var(--link);
        text-decoration: none;
        font-weight: 700;
      }

      a:hover,
      a:focus {
        color: var(--link-hover);
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        body {
          padding: 1rem;
        }

        .card {
          padding: 1.25rem 1rem;
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Hello, I'm Eddie</h1>
      <p>I built this page using Github Codespaces</p>
      <a href="https://.com/eddieeads" target="_blank" rel="noreferrer">View my Github profile</a>
    </main>
  </body>
</html>
